name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 后端类型检查
        run: pnpm --filter @resume-agent/server run typecheck

      - name: 后端构建
        run: pnpm --filter @resume-agent/server run build

      - name: 后端冒烟测试（隔离实例，不碰真实数据）
        run: pnpm --filter @resume-agent/server run smoke

      - name: 前端类型检查 + 构建
        run: pnpm --filter @resume-agent/web run build
